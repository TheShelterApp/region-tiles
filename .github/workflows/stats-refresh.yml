# Monthly refresh of the area-history statistics (stats/, see README "Area history statistics").
# Incremental by default: ComCat is read again from 1 January of the year of (last cutoff - 365 days), which picks up
# the new events and the catalogue's revisions of the last year. Every January (and on a manual run with "full") the
# whole catalogue since 1500 (the century before ComCat's earliest earthquake, 1568; SHLTR-120) is read again, so
# revisions of older events reach the files once a year.
# The result is pushed to main by the workflow's own token: main's ruleset forbids only deletion and non-fast-forward
# updates, and the repository does not let Actions open pull requests, so a fast-forward push is the compliant path.
# No secret beyond the default GITHUB_TOKEN.
# A wrong ComCat answer fails the build before any file is written (XR-1, round 16; README "Refresh"): an empty page, a
# window short of ComCat's own /count (per era), an earthquake ComCat lists before 1500 (move SINCE back), or counts
# that drop against the published files. Nothing is pushed then; run it again later, or with `accept_drop` after
# reviewing a genuine large revision in the log. Before the push a bounded verification (verify-stats.mjs --window:
# 3 sample countries, 3 ComCat requests) checks the built files against ComCat's /count in each sample box and a
# recount of the window. `dry_run` builds, tests and verifies without committing or pushing.
name: Area history statistics

on:
  schedule:
    - cron: '17 4 2 * *' # 04:17 UTC on the 2nd of every month
  workflow_dispatch:
    inputs:
      full:
        description: Rebuild everything since 1500 (reads the whole catalogue, about 5 minutes of ComCat requests)
        type: boolean
        default: false
      accept_drop:
        description: Publish even when the window count or the comparison with the published files fails (review the log first)
        type: boolean
        default: false
      dry_run:
        description: Build and test only; commit and push nothing
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: stats-refresh
  cancel-in-progress: false

jobs:
  refresh:
    # Pinned (HYG-5): ubuntu-latest moves to a new image on GitHub's schedule, and this runs unattended once a month.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Build the statistics
        env:
          FULL: ${{ inputs.full }}
          ACCEPT_DROP: ${{ inputs.accept_drop }}
        run: |
          args=()
          if [ "$FULL" = "true" ] || [ "$(date -u +%m)" = "01" ]; then args+=(--full); fi
          if [ "$ACCEPT_DROP" = "true" ]; then args+=(--accept-drop); fi
          node pipeline/stats/build-stats.mjs "${args[@]}"
      - name: Test the statistics
        run: node --test pipeline/stats/stats.test.mjs
      # R16-FOLLOWUPS (4): the built files against ComCat's own /count, bounded to this run's window and 3 sample
      # countries (the pages come from the build's cache; 3 requests). A short box or a window bin the recount does not
      # reproduce fails here, before anything is pushed; accept_drop makes them warnings, as for the build.
      - name: Verify a sample against ComCat
        env:
          ACCEPT_DROP: ${{ inputs.accept_drop }}
        run: |
          args=(--window)
          if [ "$ACCEPT_DROP" = "true" ]; then args+=(--accept-drop); fi
          node pipeline/stats/verify-stats.mjs "${args[@]}"
      - name: What changed (dry run)
        if: ${{ inputs.dry_run }}
        run: |
          git status --short stats | head -50
          git diff --stat stats | tail -5
          echo "Dry run: nothing committed or pushed."
      - name: Commit and push
        if: ${{ !inputs.dry_run }}
        run: |
          git add stats
          if git diff --cached --quiet; then
            echo "No change."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          until=$(node -p "require('./stats/index.json').until")
          git commit -m "stats: area history up to ${until}"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            # main moved during the run (only this workflow writes stats/, so the rebase has nothing to resolve).
            git fetch --deepen=100 origin main
            git rebase origin/main
          done
          exit 1
